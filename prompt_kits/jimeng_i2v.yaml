# prompt_kits/jimeng_i2v.yaml — 即梦 i2v 产品腿提示词契约
#   (plan_segments.build_hero_prompt / build_package_prompt,hero_real 形体镜与 package 包装镜)
#
# ★每个契约块上方的"出处"置语不是普通文案,是几十次翻车换来的:
#   出处丢了就等于没资产化。改措辞前必须先读出处、重跑出处里的对照。
kit: jimeng_i2v
desc: 即梦 image2video 产品/包装段提示词(单锚图,形体与质感保真)

blocks:
  # ★出处:单形态禁令 —— i2v 只吃【一张】锚图,提示词里绝不能出现那张图里没有的形态。
  #   08-12 张九九 S9:锚图只有泡沫态,提示词却写着纸盒 → 三棱锥被画成长方形纸盒;
  #   h3 腿早先用 form_desc 治好了,即梦腿一直漏着,这句就是补上的闸。
  #   product_desc 常常一句话描述所有形态,整句贴上去 = 主动指使模型画它没有参考的东西。
  no_other_form:
    text: "画面中只出现参考图里的这一种产品形态,不要出现任何其他包装、盒子、袋子或容器。"

  # ★出处:画面纯净尾注(hero/package 共用)。禁止后期类叠加是剪映分工红线
  #   (贴字/花字是后期的活,让模型画会画进实拍层);括号里"产品自带的印刷内容必须
  #   原样保留"是护栏——别把产品包装本身的字也当水印洗了。
  pure_frame:
    text: "画面纯净,不要额外叠加文字或水印(产品自带的印刷内容必须原样保留)。"

  # ★出处:hero 形体镜模板。动作从句原样带入(plan_segments 铁律,治 G3 漏动作,
  #   主播说话从句已在代码里剔除);"微距特写,镜头轻微跟随动作"是形体镜已验证的运镜措辞;
  #   {desc} 只填【本段锚图那一个形态】的描述(form_desc 优先,见 no_other_form 出处)。
  hero_prompt:
    text: "{acts}。微距特写,镜头轻微跟随动作,展示{desc}的真实质感、自然光泽({colors})。{no_other_form}真实质感,自然光。{pure_frame}"

  # ★出处:package 包装镜模板。平面印刷图案镜的已验证措辞:缓推+平移+桌面+室内柔和灯光,
  #   别加人物别加动作——包装镜加戏必漂。{desc} 同样只填本段锚图那一个形态。
  package_prompt:
    text: "镜头缓慢轻微推近并平移,展示{desc},质感高级,放在桌面上,室内柔和灯光。{no_other_form}{pure_frame}"

  # ★出处:产品动作全被剔除后的兜底动作(hero 段动作从句若全是主播说话类,
  #   product_actions_only 返回空,不能给模型空动作——空了它就自由发挥)。
  fallback_acts:
    text: "展示产品"
