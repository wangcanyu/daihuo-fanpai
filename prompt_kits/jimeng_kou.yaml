# prompt_kits/jimeng_kou.yaml — 即梦口播 mm 腿提示词契约(plan_segments.build_kou_prompt)
#
# 三层资产约定:
#   blocks = 契约段(固定文本块,{槽位} 由代码运行时填)
#   axes   = 轴选项(同一语义位置的可选措辞,每条都是已验证的原句)
#   槽位   = {host_desc}/{dialogue} 这类,代码填,绝不在 YAML 里写死
#
# ★每个契约块上方的"出处"置语不是普通文案,是几十次翻车换来的:
#   出处丢了就等于没资产化。改措辞前必须先读出处、重跑出处里的对照。
kit: jimeng_kou
desc: 即梦 multimodal 口播段提示词(@图片N/@音频N 中文自然语言,硬切至分镜)

blocks:
  # ★出处:台词契约 —— 台词逐字原样灌进 {},绝不改写(改一个字口型就对不上配音轨)。
  #   {} 符号体系来自 08 上旬字幕战役(HANDOFF「字幕是模型已知缺陷」一节:
  #   官方符号体系 {台词} + 正向约束词才能在源头压住字幕,A=竖屏+{台词} 8抽样帧零字幕)。
  #   口型句"主播嘴巴跟随音频节奏自然说话,口型同步"钉死 @音频1 驱动,别加别减。
  script_contract:
    text: "。台词{{{dialogue}}}@音频1,主播嘴巴跟随音频节奏自然说话,口型同步。"

  # ★出处:逐图声明契约 —— "@图片N是<产品desc>的<形态>(以此图为准,不要改产品外观和包装文字)"。
  #   后半句是 08-09 美吉吉2 外观战役的产物:分镜表描述的是原品牌外观,锚图是新品牌,
  #   不声明"以此图为准"模型就照文字改产品长相(皂上印乱码字、三角皂变方皂,打了三次地鼠)。
  product_fidelity:
    text: "@图片{idx}是{prod_desc}的{label}(以此图为准,不要改产品外观和包装文字)。"

  # ★出处:画幅声明。竖屏 9:16 是带货复刻的固定画幅;字幕战役里 A 组(竖屏+官方规范)
  #   实测零字幕,画幅词本身就是约束体系的一部分,不是可有可无的格式说明。
  ratio:
    text: "竖屏9:16。"

  # ★出处:场景槽。场景取首镜 scene 原样带入(plan_segments 铁律:分镜表里的
  #   subject+action+scene 原样进提示词,治"漏动作/漏场景";改写即漂移源)。
  scene:
    text: "场景:{scene}。"

  # ★出处:单镜子句装配模板 —— [硬切至]<景别><运镜>,<动作>。
  #   cut 槽位空=首镜,非空=cut_to 块(硬切至)。动作原样带入,治漏动作(G3)。
  shot_clause:
    text: "{cut}{shot_size}{camera},{action}"

  # ★出处:内部硬切连接词。即梦段内多镜靠"硬切至"调度;MAX_CUTS=3 的红线就是
  #   围绕它定的(即梦内部硬切实测 5 崩,留足余量只并 3 镜)。词形别动,即梦认这个说法。
  cut_to:
    text: "硬切至"

  # ★出处:质感/洁净尾注。字幕战役结论(HANDOFF):字幕是模型已知缺陷无法 100% 避免,
  #   约束词只降概率,但"保持无字幕"正向句式实测有效(负向"不要出现"效果弱)——
  #   所以这句以"保持无字幕"打头,后面才是否定列举。BGM/Logo/水印逐项点名叫收尾约束。
  tail:
    text: "电影质感,真实生活感。保持无字幕,不要生成BGM或背景音乐,不要生成Logo,不要生成水印。"

axes:
  # ★出处:主播身份声明两形态 —— 有 host_desc 用 with_desc(外形一句话钉死跨段穿着一致,
  #   plan_segments:host_desc 注释);没有就退回 plain 泛声明。两形态都是线上在跑的原句。
  host_identity:
    with_desc: "@图片1是带货主播本人({host_desc}),每一个镜头都保持与@图片1完全一致的长相、发型和这身穿着:{host_desc}。"
    plain: "@图片1是带货主播本人,全程保持@图片1长相穿着一致。"
